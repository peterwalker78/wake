[package]
name = "wake-core"
description = "Wake's core: reads agent transcripts, live sessions, processes and git, with no user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# /proc, signals (pidfd), uid, clock ticks.
libc = "0.2"
# Fast substring checks on transcript lines before any JSON is decoded.
memchr = "2"
# Plays `claude logs` output onto a terminal grid for the background preview.
vte = { version = "0.15", default-features = false, features = ["std"] }
# Settings (~/.config/wake/settings.toml): unknown keys kept as they are.
toml = "0.9"
